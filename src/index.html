<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>CalistenicTrack v2 — Monitor Atlético BLE</title>
  <meta name="description" content="Monitoriza tu frecuencia cardíaca en tiempo real durante entrenamientos de calistenia con wearables BLE.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Apply saved dark mode BEFORE render to prevent FOUC -->
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('ct_theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('app-dark');
        }
      } catch(e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
