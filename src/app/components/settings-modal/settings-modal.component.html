<p-dialog
  id="settings-dialog"
  [(visible)]="isVisible"
  (onHide)="close()"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  header="⚙️ Configuración"
  [style]="{ width: '480px', 'max-width': '95vw' }"
  styleClass="ct-glass-dialog"
>
  <div class="flex flex-col gap-6 p-2">

    <!-- Promo Card -->
    <div class="relative overflow-hidden bg-gradient-to-br from-amber-500/10 to-orange-500/5 border border-amber-500/20 rounded-2xl p-5 shadow-[inset_0_0_20px_rgba(245,158,11,0.05)] transition-transform hover:-translate-y-1 duration-300">
      <div class="absolute top-[-30px] right-[-30px] w-24 h-24 bg-amber-500/20 rounded-full blur-2xl pointer-events-none"></div>
      
      <p-tag value="PRO ATHLETE" severity="warn" icon="pi pi-star-fill" [rounded]="true" styleClass="!bg-amber-500/20 !text-amber-500 !border !border-amber-500/30 text-[9px] font-black tracking-widest px-2 py-0.5 mb-3 shadow-[0_0_10px_rgba(245,158,11,0.2)]" />
      <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100 mb-1.5 leading-tight">¡Obtén CalistenicTrack Premium al 50%!</h3>
      <p class="text-xs text-slate-600 dark:text-slate-400 m-0 leading-relaxed">Análisis en la nube, reportes PDF para tu entrenador, y sincronización con Strava y Google Fit.</p>
    </div>

    <div class="w-full h-px bg-slate-200/50 dark:bg-slate-800/60"></div>

    <!-- HR Settings -->
    <div class="flex flex-col gap-5">
      <h4 class="text-[11px] font-black text-indigo-500 dark:text-indigo-400 uppercase tracking-widest m-0 flex items-center gap-1.5">
        <i class="pi pi-heart"></i> Umbrales de Frecuencia Cardíaca
      </h4>

      <div class="flex flex-col gap-2 p-4 rounded-xl bg-slate-100/50 dark:bg-slate-900/40 border border-slate-200 dark:border-slate-800/50 transition-colors hover:border-indigo-500/30">
        <div class="flex items-center justify-between mb-1">
          <span class="text-sm font-bold text-slate-700 dark:text-slate-200">Umbral Máximo Seguro</span>
          <p-inputnumber
            id="max-hr-input"
            [(ngModel)]="maxHrThreshold"
            [min]="140" [max]="220"
            suffix=" BPM"
            [showButtons]="true"
            buttonLayout="horizontal"
            [style]="{ width: '130px' }"
            styleClass="p-inputtext-sm !bg-slate-200/50 dark:!bg-slate-800/50 !border-slate-300 dark:!border-slate-700"
          />
        </div>
        <p-slider id="max-hr-slider" [(ngModel)]="maxHrThreshold" [min]="140" [max]="220" styleClass="w-full mt-2" />
      </div>

      <div class="flex flex-col gap-2 p-4 rounded-xl bg-slate-100/50 dark:bg-slate-900/40 border border-slate-200 dark:border-slate-800/50 transition-colors hover:border-emerald-500/30">
        <div class="flex items-center justify-between mb-1">
          <span class="text-sm font-bold text-slate-700 dark:text-slate-200">Zona Objetivo Mínima</span>
          <p-inputnumber
            id="zone-min-input"
            [(ngModel)]="targetZoneMin"
            [min]="60" [max]="targetZoneMax - 5"
            suffix=" BPM"
            [showButtons]="true"
            buttonLayout="horizontal"
            [style]="{ width: '130px' }"
            styleClass="p-inputtext-sm !bg-slate-200/50 dark:!bg-slate-800/50 !border-slate-300 dark:!border-slate-700"
          />
        </div>
        <p-slider id="zone-min-slider" [(ngModel)]="targetZoneMin" [min]="60" [max]="targetZoneMax - 5" styleClass="w-full mt-2" />
      </div>

      <div class="flex flex-col gap-2 p-4 rounded-xl bg-slate-100/50 dark:bg-slate-900/40 border border-slate-200 dark:border-slate-800/50 transition-colors hover:border-red-500/30">
        <div class="flex items-center justify-between mb-1">
          <span class="text-sm font-bold text-slate-700 dark:text-slate-200">Zona Objetivo Máxima</span>
          <p-inputnumber
            id="zone-max-input"
            [(ngModel)]="targetZoneMax"
            [min]="targetZoneMin + 5" [max]="220"
            suffix=" BPM"
            [showButtons]="true"
            buttonLayout="horizontal"
            [style]="{ width: '130px' }"
            styleClass="p-inputtext-sm !bg-slate-200/50 dark:!bg-slate-800/50 !border-slate-300 dark:!border-slate-700"
          />
        </div>
        <p-slider id="zone-max-slider" [(ngModel)]="targetZoneMax" [min]="targetZoneMin + 5" [max]="220" styleClass="w-full mt-2" />
      </div>
    </div>

  </div>

  <ng-template pTemplate="footer">
    <div class="flex gap-3 justify-end w-full border-t border-slate-200/50 dark:border-slate-800/50 pt-4 mt-2">
      <button class="px-5 py-2.5 rounded-xl font-bold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer" (click)="close()">Cancelar</button>
      <button class="px-5 py-2.5 rounded-xl font-bold text-white bg-gradient-to-r from-indigo-600 to-cyan-500 hover:from-indigo-500 hover:to-cyan-400 shadow-[0_0_15px_rgba(99,102,241,0.3)] hover:shadow-[0_0_20px_rgba(99,102,241,0.5)] transition-all flex items-center gap-2 cursor-pointer" (click)="save()">
        <i class="pi pi-check"></i>
        <span>Guardar cambios</span>
      </button>
    </div>
  </ng-template>
</p-dialog>
