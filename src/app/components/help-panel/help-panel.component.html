<section class="glass-card help-panel">
  <h3 class="help-title">
    <i class="pi pi-question-circle"></i>
    Compatibilidad y Ayuda
  </h3>
  <p-accordion [multiple]="true">
    @for (item of helpItems; track item.title; let i = $index) {
      <p-accordion-panel [value]="'help-' + i">
        <p-accordion-header>
          <span class="help-header">
            <span class="help-icon">{{ item.icon }}</span>
            <span>{{ item.title }}</span>
          </span>
        </p-accordion-header>
        <p-accordion-content>
          <p class="help-desc">{{ item.description }}</p>
        </p-accordion-content>
      </p-accordion-panel>
    }
  </p-accordion>
</section>
