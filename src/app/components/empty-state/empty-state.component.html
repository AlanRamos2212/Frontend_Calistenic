<!-- Empty State Card -->
<div class="empty-state glass-card">
  <div class="empty-icon">{{ icon }}</div>
  <h3 class="empty-title">{{ title }}</h3>
  <p class="empty-description">{{ description }}</p>
  
  <button 
    *ngIf="actionText"
    (click)="handleAction()"
    class="btn btn-primary"
  >
    {{ actionText }}
  </button>
</div>
