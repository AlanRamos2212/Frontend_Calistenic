<!-- Global toast for all pages -->
<p-toast position="top-right" [breakpoints]="{'920px': {width: '100%', right: '0', left: '0'}}" />

@if (showShell()) {
  <div class="flex flex-col min-h-screen w-full bg-slate-50 dark:bg-[#080810] text-slate-900 dark:text-slate-50">
    <!-- Sticky Header -->
    <app-header />

    <!-- Page Content via Router -->
    <main class="flex-1 w-full flex justify-center px-4 sm:px-6 lg:px-8 py-8 md:py-10 lg:py-12 pb-16 md:pb-20">
      <div class="w-full max-w-[1400px] flex-1 flex flex-col">
        <router-outlet />
      </div>
    </main>

    <!-- Global Footer -->
    <app-footer />
  </div>
} @else {
  <!-- Landing page renders its own full layout -->
  <router-outlet />
}
