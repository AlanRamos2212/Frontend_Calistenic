<div class="max-w-[1000px] mx-auto px-6 py-10 flex flex-col gap-8">

  <!-- Hero Coming Soon -->
  <div class="glass-card p-8 md:p-12 relative overflow-hidden flex flex-col md:flex-row items-center justify-between gap-8 bg-gradient-to-br from-indigo-500/5 to-cyan-500/5 animate-fade-in">
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_80%_50%,rgba(99,102,241,0.12)_0%,transparent_60%)] pointer-events-none"></div>
    <div class="flex flex-col gap-5 max-w-[520px] relative z-10 items-start">
      <p-tag id="comunidad-badge" value="Próximamente" severity="warn" icon="pi pi-clock" [rounded]="true" styleClass="text-[10px] font-bold uppercase" />
      <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-500 to-cyan-500 bg-clip-text text-transparent m-0">Comunidad CalistenicTrack</h1>
      <p class="text-sm text-slate-600 dark:text-slate-400 leading-relaxed m-0">
        Estamos construyendo el espacio donde los atletas se conectan, compiten y se motivan juntos.
        Únete a la lista de espera para ser el primero en acceder.
      </p>
      <div class="flex flex-wrap gap-3">
        <p-button
          id="waitlist-btn"
          label="Unirse a la lista de espera"
          icon="pi pi-bell"
          severity="contrast"
          [disabled]="true"
          styleClass="font-semibold"
        />
        <p-button
          id="dashboard-from-comunidad"
          label="Ir al Dashboard"
          icon="pi pi-chart-line"
          severity="secondary"
          [outlined]="true"
          routerLink="/dashboard"
          styleClass="font-semibold"
        />
      </div>
    </div>
    <i class="pi pi-globe text-8xl text-indigo-500/10 dark:text-indigo-400/5 pointer-events-none absolute right-8 top-1/2 -translate-y-1/2 hidden md:block" aria-hidden="true"></i>
  </div>

  <!-- Feature Preview -->
  <div class="flex flex-col gap-4 animate-fade-in">
    <h2 class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-0">Lo que viene</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      @for (f of features; track f.title) {
        <div class="glass-card p-6 flex flex-col gap-3 hover:border-indigo-200 dark:hover:border-indigo-900/30 transition-all duration-300">
          <div class="w-10 h-10 rounded-lg bg-indigo-50 dark:bg-indigo-950/20 text-indigo-500 flex items-center justify-center">
            <i class="pi text-lg" [ngClass]="f.icon"></i>
          </div>
          <div class="flex flex-col gap-1.5">
            <h3 class="text-sm font-bold text-slate-800 dark:text-slate-100 m-0">{{ f.title }}</h3>
            <p class="text-xs text-slate-600 dark:text-slate-400 leading-relaxed m-0">{{ f.desc }}</p>
          </div>
        </div>
      }
    </div>
  </div>

</div>
